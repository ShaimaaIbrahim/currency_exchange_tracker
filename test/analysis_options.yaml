# Tests inherit every rule from the root config, with two relaxations that
# only make sense outside `lib/`.
include: ../analysis_options.yaml

linter:
  rules:
    # `package:` imports cannot reach test helpers, which live outside `lib/`.
    always_use_package_imports: false

    # Test data is intentionally verbose and repetitive; requiring a trailing
    # comma on every fixture literal adds noise without adding clarity.
    require_trailing_commas: false
