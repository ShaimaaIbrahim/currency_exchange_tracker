name: currency_exchange_tracker
description: "Live EGP exchange-rate tracker with historical charts and offline cache."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # ── State management ───────────────────────────────────────────────
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7

  # ── Dependency injection ──────────────────────────────────────────
  get_it: ^8.2.0

  # ── Networking ────────────────────────────────────────────────────
  dio: ^5.9.0
  connectivity_plus: ^7.0.0

  # ── Local persistence ─────────────────────────────────────────────
  shared_preferences: ^2.5.3

  # ── Navigation ────────────────────────────────────────────────────
  go_router: ^17.2.0

  # ── UI ────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  fl_chart: ^1.1.1
  shimmer: ^3.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
